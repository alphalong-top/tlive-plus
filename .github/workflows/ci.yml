name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest is the project's only Windows coverage: the named-pipe
    # IPC branches, PATHEXT command resolution, and the win32 shell runner.
    # Runners ship VS Build Tools, so node-pty's native build is validated too.
    #
    # All Windows tests PASS (65/65 files). Named-pipe timing is handled by
    # win32-only retry (vitest.config.ts) + a shutdown that force-closes
    # in-flight IPC connections (server.ts). The shared runner STILL flakes
    # ~1-in-3 on residual process-level teardown noise (EAGAIN pipe write / a
    # dangling ipc-timeout) that needs a real Windows box to fully drain — too
    # high to gate main on. Kept NON-BLOCKING (ubuntu is the hard gate); #45.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
