name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest is the project's only Windows coverage: the named-pipe
    # IPC branches, PATHEXT command resolution, and the win32 shell runner.
    # Runners ship VS Build Tools, so node-pty's native build is validated too.
    #
    # Windows now runs GREEN test-wise (all 65 files pass; win32-only retry in
    # vitest.config.ts absorbs timing jitter), but the shared runner still
    # intermittently surfaces named-pipe teardown noise as process-level
    # unhandled errors (EAGAIN pipe write / a dangling ipc-timeout rejection on
    # daemon shutdown) that retry can't catch. Kept NON-BLOCKING so that noise
    # doesn't gate main; ubuntu is the hard gate. Tracked in #45 — flip back to
    # blocking once shutdown drains in-flight pipe I/O cleanly on Windows.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
