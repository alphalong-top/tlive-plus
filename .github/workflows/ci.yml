name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest is the project's only Windows coverage: the named-pipe
    # IPC branches, PATHEXT command resolution, and the win32 shell runner.
    # Runners ship VS Build Tools, so node-pty's native build is validated too.
    # Both OSes are hard gates. Named-pipe timing is handled by win32-only test
    # retry (vitest.config.ts) plus a clean shutdown that force-closes in-flight
    # IPC connections (server.ts) so teardown doesn't leak unhandled errors.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
